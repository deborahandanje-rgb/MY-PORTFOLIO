name: Optimize portfolio images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install image optimizer
        run: npm install --no-save sharp

      - name: Convert large images to WebP
        run: node scripts/optimize-images.mjs

      - name: Commit optimized images and updated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images index.html portfolio.html services.html contact.html styles.css
          if git diff --cached --quiet; then
            echo "No image optimization changes to commit."
          else
            git commit -m "Optimize large portfolio images as WebP"
            git push origin main
          fi
